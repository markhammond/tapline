<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grid harness</title>
    <link rel="stylesheet" href="/src/Tapline.Grid/wwwroot/tapline-grid.css">
    <style>
        :root { color-scheme: light dark; font: 13px/1.4 system-ui, sans-serif; }
        body { margin: 0; padding: 12px 16px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; gap: 8px; }
        header { display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; }
        header b { font-weight: 600; }
        #frame { flex: 1; height: auto; }
        .tapline-grid .tg-row:nth-child(even):not(.tg-selected) { background: color-mix(in srgb, CanvasText 4%, transparent); }
    </style>
</head>
<body>
<header>
    <b>Grid harness</b>
    <span id="status">…</span>
</header>
<div id="frame" class="live-grid">
    <div id="host" class="tg-grid" role="grid" tabindex="0" aria-label="Orders" aria-multiselectable="true">
        <div id="headings" class="tg-head" role="rowgroup"><div class="tg-head-row" role="row" aria-rowindex="1"></div></div>
        <div id="grid" class="tg-body"></div>
    </div>
</div>
<script type="module" src="/tests/js/grid-harness.mjs"></script>
</body>
</html>
